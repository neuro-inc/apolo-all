[project]
name = "apolo-all"
version = "26.8.0"
description = "Combo package for installing all Apolo command line tools by 'pipx install apolo-all' command"
readme = "README.md"
authors = [
    { name = "Apolo Team", email = "dev@apolo.us" },
]
license = "Apache-2.0"
keywords = [
    "neu.ro",
    "mlops",
    "apolo",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dynamic = ["dependencies", "requires-python"]

[project.urls]
Homepage = "https://apolo.us"
Repository = "https://github.com/neuro-inc/apolo-all"

[project.scripts]
apolo = "apolo_cli.main:main"
docker-credential-apolo = "apolo_cli.docker_credential_helper:main"
apolo-extras = "apolo_extras:main"
apolo-flow = "apolo_flow.cli:main"
apolo-mcp = "apolo_mcp.cli:main"

[project.entry-points.apolo_all]
apolo-all = "apolo_all:setup"

[tool.poetry]
packages = [
    { include = "apolo_all" },
]

[tool.poetry.dependencies]
python = "^3.11.0"
apolo-cli = "26.7.2"
apolo-sdk = "26.7.2"
apolo-extras = "26.8.0"
apolo-flow = "26.7.2"
apolo-mcp = "26.8.1"
certifi = "2026.7.22"

[tool.poetry.group.dev.dependencies]
towncrier = ">=24.8,<26.0"
pytest = "9.1.1"
pre-commit = "^4.2.0"
click = "^8.1.7"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "RUF100", "T10", "UP", "W"]
ignore = ["E252", "F541"]

[tool.ruff.lint.isort]
combine-as-imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
