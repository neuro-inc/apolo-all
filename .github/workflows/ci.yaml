name: CI

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]
  schedule:
    - cron: 0 12 * * *

jobs:
  lint:
    name: Linter (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|py${{ matrix.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Cache PyPI
        uses: actions/cache@v6
        with:
          key: lint-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          path: ~/.cache/pip
          restore-keys: |
            lint-
      - name: Install dependencies
        run: |
          pip install poetry
          make setup
      - name: Run linters
        run: |
          make lint
        env:
          CI_LINT_RUN: 1
      - name: Save the package version
        id: version
        run: |
          echo "version=$(poetry version --short)" >> $GITHUB_OUTPUT
      - name: Show version
        run: |
          echo ${{ steps.version.outputs.version }}

  approve:
    name: Approve bot PR
    runs-on: ubuntu-latest
    if: endsWith(github.actor, '[bot]')
    needs: [lint, e2e]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for bot PRs
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Wheel installation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install poetry
          poetry build --format wheel
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .e2e-venv
          .e2e-venv/bin/python -m pip install dist/*.whl
          .e2e-venv/bin/python -m pip check
      - name: Test installed package
        run: .e2e-venv/bin/python tests/e2e_installation.py

  deploy:
    name: Deploy on PyPI
    environment: release
    needs: [lint, e2e]
    runs-on: ubuntu-latest
    # Run only on pushing a tag
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - name: Sanity check for tag and version
        run: |
          if [ "refs/tags/v${{ needs.lint.outputs.version }}" != "${{ github.ref }}" ]
          then
            echo "Tag ${{ github.ref }} mismatches with ${{ needs.lint.outputs.version }}"
            exit 1
          else
            echo "Tag matches version ${{ needs.lint.outputs.version }}"
          fi
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install poetry
        run: |
          pip install poetry
      - name: Build package
        run: |
          poetry build
      - name: GitHub Release
        uses: aio-libs/create-release@v1.6.6
        with:
          changes_file: CHANGELOG.md
          name: Apolo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pypi_token: ${{ secrets.PYPI_TOKEN }}
          version: ${{ needs.lint.outputs.version }}
          start_line: "[comment]: # (release notes start)"
          head_line: "Apolo {version}\\s+\\({date}\\)\n====+\n?"
          fix_issue_regex: "\\(\\[#(\\d+)\\]\\(https://github.com/neuro-inc/[^/]+/issues/\\1\\)\\)"
          fix_issue_repl: "(#\\1)"
