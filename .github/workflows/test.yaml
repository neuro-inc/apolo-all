name: Tests

on:
  workflow_call: {}

jobs:
  lint:
    name: Linter (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|py${{ matrix.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Cache PyPI
        uses: actions/cache@v6
        with:
          key: lint-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          path: ~/.cache/pip
          restore-keys: |
            lint-
      - name: Install dependencies
        run: |
          pip install poetry
          make setup
      - name: Run linters
        run: make lint
        env:
          CI_LINT_RUN: 1

  e2e:
    name: Wheel installation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install poetry
          poetry build --format wheel
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .e2e-venv
          .e2e-venv/bin/python -m pip install dist/*.whl
          .e2e-venv/bin/python -m pip check
      - name: Test installed package
        run: .e2e-venv/bin/python tests/e2e_installation.py
